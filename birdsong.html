<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <title>ofsaeily — Birdsong for the Confined</title>

  <!-- Font: Source Serif Pro -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Source Serif Pro', serif !important;
      font-weight: 400;
    }

    body {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      background: #eaebe5;
      color: #1a1a1a;
      position: relative;
    }

    /* Grain overlay for body */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    /* EXACT HEADER FROM EXAMPLE 1 */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 40px;
      background: #eaebe5;
      position: relative;
      z-index: 2;
    }

    /* Grain overlay for header */
    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: -1;
    }

    .col {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .email {
      text-transform: none;
      opacity: 0.7;
    }

    .menu a {
      text-decoration: none;
      color: inherit;
      margin-bottom: 1px;
    }

    .menu a:hover {
      opacity: 0.6;
    }

    /* END OF EXACT HEADER FROM EXAMPLE 1 */

    /* CAROUSEL WRAPPER */
    .carousel-wrapper {
      width: 100%;
      margin-top: 40px;
      background: #eaebe5;
    }

    .carousel-container {
      width: 100%;
      max-width: 100%;
      overflow: visible;
      position: relative;
      padding: 0 60px;
      box-sizing: border-box;
    }

    /* Main carousel frame */
    .carousel-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #eaebe5;
    }

    .carousel-viewport {
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      scroll-snap-type: x mandatory;
    }
    .carousel-viewport:active {
      cursor: grabbing;
    }
    .carousel-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Track - flex row with variable width items */
    .carousel-track {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
    }

    /* Each image item - variable width based on natural aspect ratio */
    .carousel-item {
      flex-shrink: 0;
      scroll-snap-align: start;
      background: #eaebe5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .carousel-img {
      height: 55vh;
      width: auto;
      max-width: none;
      display: block;
      object-fit: contain;
      background: #eaebe5;
    }

    /* Video items - fixed width for consistency */
    .carousel-video {
      height: 55vh;
      width: auto;
      display: block;
      object-fit: contain;
      background: #1a1a1a;
    }

    /* TEXT SLIDE - WIDER (600px fixed width) with scroll if needed */
    .carousel-text-item {
      width: 600px;
      flex-shrink: 0;
      scroll-snap-align: start;
      background: #eaebe5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 30px;
      box-sizing: border-box;
      height: auto;
      min-height: 55vh;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    /* Custom scrollbar for text slide */
    .carousel-text-item::-webkit-scrollbar {
      width: 4px;
    }
    .carousel-text-item::-webkit-scrollbar-track {
      background: #ddd6cc;
      border-radius: 4px;
    }
    .carousel-text-item::-webkit-scrollbar-thumb {
      background: #8a857c;
      border-radius: 4px;
    }
    
    .text-card {
      max-width: 100%;
      width: 100%;
      height: auto;
      padding: 20px 0;
    }
    .text-card .text-title {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.3px;
      margin-bottom: 1.5rem;
      color: #111;
      text-transform: uppercase;
      text-align: center;
    }
    .text-card .text-paragraph {
      font-size: 12px;
      line-height: 1.6;
      color: #2a2a2a;
      margin-bottom: 1rem;
      font-weight: 400;
      text-align: justify;
    }
    .text-card .text-paragraph:last-of-type {
      margin-bottom: 0;
    }

    /* Navigation arrows */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 1px solid #111;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 400;
      color: #111;
      transition: all 0.2s ease;
      z-index: 20;
      background: rgba(234, 235, 229, 0.85);
      backdrop-filter: blur(3px);
    }
    .carousel-arrow:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .arrow-prev {
      left: 15px;
    }
    .arrow-next {
      right: 15px;
    }

    /* Dot navigation */
    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0;
      padding: 20px 0 8px 0;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid #aaa;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dot.active {
      background: #333;
      border: 1px solid #333;
      width: 18px;
      border-radius: 10px;
    }
    .dot:hover {
      border-color: #111;
    }

    /* FOOTER */
    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #888;
      background: #eaebe5;
      border-top: none;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-top: 0;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .carousel-container {
        padding: 0 50px;
      }
      .carousel-img, .carousel-video {
        height: 45vh;
      }
      .carousel-text-item {
        width: 500px;
        min-height: 45vh;
        padding: 0 25px;
      }
      .carousel-arrow {
        width: 38px;
        height: 38px;
        font-size: 1.3rem;
      }
    }

    @media (max-width: 700px) {
      .carousel-container {
        padding: 0 40px;
      }
      .carousel-img, .carousel-video {
        height: 35vh;
      }
      .carousel-text-item {
        width: 400px;
        min-height: 35vh;
        padding: 0 20px;
      }
      .carousel-arrow {
        width: 34px;
        height: 34px;
        font-size: 1.1rem;
      }
      header {
        padding: 16px 20px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .carousel-wrapper {
        margin-top: 30px;
      }
      .dots {
        padding: 16px 0 8px 0;
      }
      .text-card .text-title {
        font-size: 16px;
        margin-bottom: 1rem;
      }
    }

    @media (max-width: 500px) {
      .carousel-container {
        padding: 0 30px;
      }
      .carousel-img, .carousel-video {
        height: 30vh;
      }
      .carousel-text-item {
        width: 320px;
        min-height: 30vh;
        padding: 0 15px;
      }
      .carousel-arrow {
        width: 30px;
        height: 30px;
        font-size: 1rem;
      }
      .text-card .text-paragraph {
        font-size: 11px;
        line-height: 1.5;
      }
    }
  </style>
</head>

<!-- VARIABLE WIDTH CAROUSEL SECTION -->
<div class="carousel-wrapper">
  <div class="carousel-container">
    <div class="carousel-frame">
      <button class="carousel-arrow arrow-prev" id="prevBtn" aria-label="Previous">‹</button>
      <button class="carousel-arrow arrow-next" id="nextBtn" aria-label="Next">›</button>

      <div class="carousel-viewport" id="viewport">
        <div class="carousel-track" id="track">
          <!-- Items injected dynamically -->
        </div>
      </div>
    </div>

    <div class="dots" id="dotsContainer"></div>
  </div>
</div>

<footer>
  © 2025 by ofsaeily
</footer>

<script>
  // ALL IMAGES + text slide - text slide is wider to fit all content
  const items = [
    { type: 'image', src: 'Picsart_25-12-19_20-32-55-278.jpg', alt: 'birdsongfortheconfined' },
    { type: 'image', src: 'lily 2.jpg', alt: 'A-portrait-of-lilies' },
    { type: 'image', src: 'lily 1.jpg', alt: 'A-portrait-of-lilies' },
    { type: 'image', src: 'bird 2.jpg', alt: 'Birdsong-for-the-confined' },
    { type: 'image', src: 'aa.jpg', alt: 'birdsongfortheconfined' },
    { type: 'image', src: 'b2.jpg', alt: 'Reminiscence-of-a-Memory' },
    { type: 'image', src: 'reminsce 1.jpg', alt: 'Reminiscence-of-a-Memory' },
    { type: 'image', src: 'aaa.jpg', alt: 'birdsongfortheconfined' },
    { type: 'image', src: 'rest.jpg', alt: 'This-Is-The-Rest-Needed-For-Living' },
    { type: 'image', src: 'ab.jpg', alt: 'Reminiscence-of-a-Memory' },
    { type: 'image', src: 'day.jpg', alt: 'THe-day-has-passed' },
    { type: 'image', src: 'aa1.jpg', alt: 'birdsongfortheconfined' },
    { type: 'image', src: 'aa3.jpg', alt: 'birdsongfortheconfined' },
    { type: 'image', src: 'ad.jpg', alt: 'Birdsong-for-the-confined' },
    { type: 'image', src: 'flow of.jpg', alt: 'The-flow-of-a-river' },
    { type: 'image', src: 'Translucent light 1.jpg', alt: 'Translucent-Light' },
    { type: 'image', src: 'quiet.jpg', alt: 'A-sense-of-quiet' },
    { type: 'image', src: 'fig a.jpg', alt: 'Fig' },
    { type: 'image', src: 'evening.jpg', alt: 'Late-Evening-Afternoon' },
    { type: 'image', src: 'dawn.jpg', alt: 'dawn' },
    { type: 'image', src: 'Escapism1.jpg', alt: 'Escapism' },
    { type: 'image', src: 'afloat.jpg', alt: 'afloat' },
    { type: 'image', src: 'aa4.jpg', alt: 'birdsongfortheconfined' },
    { type: 'image', src: 'ae.jpg', alt: 'birdsongfortheconfined' },
    { type: 'text', 
      title: 'BIRDSONG FOR THE CONFINED', 
      paragraphs: [
        'A year ago, I learned of the term escapism and realized how much it applied to my everyday life. The epiphany led to a five-part poem and later, a series of photographs, videos, poems, and paintings collectively titled Birdsong for the Confined, birthed from a phase of drowsy eyes and daydreaming, when my way of living became a cage, and I became the confined.',
        'In my predicament, I discovered that escapism had become a routine and a means of regaining a sense of normalcy. I drifted in and out of the present, losing myself for hours in reveries and then drowning in guilt over it, only to relapse into the same pattern subsequently. This became a maladaptive problem I couldn\'t seem to get rid of.',
        'Yet, over the course of a month, I had begun writing fervently and regularly in my notebook. It allowed me to anchor and express myself and provided me with a sense of creative freedom. I had a vision—I thought a lot, ran over it repeatedly, lived it, and wanted to capture it.',
        'At a certain point, I yearned for something more concrete and visual in addition to my writings. I had a few ideas for my paintings, a vision so vivid it seared its presence onto my head day and night. For two months, I experimented with my paintings and ceramics, learned my way around the materials, and occasionally took a series of photographs and videos that would eventually complete the collection.',
        'In this exhibition, paintings, ceramics and poetry all come together to initiate a dialogue on the confinement of self, conflict, and the transcending nature of art.'
      ] }
  ];

  const track = document.getElementById('track');
  const dotsContainer = document.getElementById('dotsContainer');
  const viewport = document.getElementById('viewport');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentPage = 0;
  let itemsPerPage = 0;
  let totalPages = 0;

  // Calculate how many items fit per page based on viewport width
  function calculateItemsPerPage() {
    if (!viewport) return 2;
    const viewportWidth = viewport.clientWidth;
    // Average item width ~300px + gap 20px
    const avgItemWidth = 320;
    let count = Math.floor(viewportWidth / avgItemWidth);
    return Math.max(1, Math.min(count, 4));
  }

  // Build the carousel
  function buildCarousel() {
    track.innerHTML = '';
    dotsContainer.innerHTML = '';

    items.forEach((item, idx) => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'carousel-item';

      if (item.type === 'image') {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.alt || `Work ${idx+1}`;
        img.className = 'carousel-img';
        img.loading = idx < 10 ? 'eager' : 'lazy';
        img.style.height = '55vh';
        img.style.width = 'auto';
        itemDiv.appendChild(img);
      } 
      else if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.src;
        video.className = 'carousel-video';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.style.height = '55vh';
        video.style.width = 'auto';
        itemDiv.appendChild(video);
        // Auto-play when in view
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              video.play().catch(e => console.log(''));
            } else {
              video.pause();
            }
          });
        }, { threshold: 0.5 });
        observer.observe(itemDiv);
      }
      else if (item.type === 'text') {
        itemDiv.classList.add('carousel-text-item');
        const textCard = document.createElement('div');
        textCard.className = 'text-card';
        let html = `<div class="text-title">${escapeText(item.title)}</div>`;
        if (item.paragraphs && Array.isArray(item.paragraphs)) {
          item.paragraphs.forEach(para => {
            html += `<div class="text-paragraph">${escapeText(para)}</div>`;
          });
        }
        textCard.innerHTML = html;
        itemDiv.appendChild(textCard);
      }
      track.appendChild(itemDiv);
    });

    updatePages();
    createDots();
    scrollToPage(0);
  }

  function escapeText(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function updatePages() {
    itemsPerPage = calculateItemsPerPage();
    totalPages = Math.ceil(items.length / itemsPerPage);
  }

  function createDots() {
    dotsContainer.innerHTML = '';
    for (let i = 0; i < totalPages; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === currentPage) dot.classList.add('active');
      dot.setAttribute('data-page', i);
      dot.addEventListener('click', () => {
        scrollToPage(i);
      });
      dotsContainer.appendChild(dot);
    }
  }

  function scrollToPage(page) {
    if (page < 0) page = 0;
    if (page >= totalPages) page = totalPages - 1;
    if (currentPage === page) return;
    
    currentPage = page;
    
    const itemsArray = Array.from(track.children);
    const startIndex = currentPage * itemsPerPage;
    
    if (startIndex < itemsArray.length) {
      const targetItem = itemsArray[startIndex];
      const scrollLeft = targetItem.offsetLeft - 20;
      viewport.scrollTo({ left: scrollLeft, behavior: 'smooth' });
    }
    
    updateDots();
  }

  function updateDots() {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, i) => {
      if (i === currentPage) dot.classList.add('active');
      else dot.classList.remove('active');
    });
  }

  function nextPage() {
    if (currentPage < totalPages - 1) {
      scrollToPage(currentPage + 1);
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      scrollToPage(currentPage - 1);
    }
  }

  function updateCurrentPageFromScroll() {
    const scrollLeft = viewport.scrollLeft;
    const itemsArray = Array.from(track.children);
    
    for (let i = 0; i < itemsArray.length; i++) {
      const item = itemsArray[i];
      const itemLeft = item.offsetLeft;
      const itemRight = itemLeft + item.offsetWidth;
      const viewportCenter = scrollLeft + viewport.clientWidth / 2;
      
      if (viewportCenter >= itemLeft && viewportCenter <= itemRight) {
        const newPage = Math.floor(i / itemsPerPage);
        if (newPage !== currentPage && newPage < totalPages) {
          currentPage = newPage;
          updateDots();
        }
        break;
      }
    }
  }

  function onScroll() {
    updateCurrentPageFromScroll();
  }

  function onResize() {
    updatePages();
    createDots();
    scrollToPage(currentPage);
  }

  // Drag to scroll
  let isDragging = false;
  let startX = 0;
  let scrollStart = 0;

  function onDragStart(e) {
    if (e.target.closest('.carousel-arrow') || e.target.closest('.dot')) return;
    isDragging = true;
    startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
    scrollStart = viewport.scrollLeft;
    viewport.style.cursor = 'grabbing';
    e.preventDefault();
  }

  function onDragMove(e) {
    if (!isDragging) return;
    const x = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
    const walk = (x - startX) * 1.5;
    viewport.scrollLeft = scrollStart - walk;
  }

  function onDragEnd() {
    isDragging = false;
    viewport.style.cursor = 'grab';
    updateCurrentPageFromScroll();
  }

  function initDrag() {
    viewport.addEventListener('mousedown', onDragStart);
    viewport.addEventListener('touchstart', onDragStart, { passive: false });
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('touchmove', onDragMove, { passive: false });
    window.addEventListener('mouseup', onDragEnd);
    window.addEventListener('touchend', onDragEnd);
    
    const imgs = document.querySelectorAll('.carousel-img');
    imgs.forEach(img => img.addEventListener('dragstart', (e) => e.preventDefault()));
  }

  function onKey(e) {
    if (e.key === 'ArrowLeft') {
      prevPage();
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      nextPage();
      e.preventDefault();
    }
  }

  function init() {
    buildCarousel();
    setTimeout(() => {
      viewport.style.cursor = 'grab';
    }, 100);
    
    initDrag();
    window.addEventListener('resize', onResize);
    viewport.addEventListener('scroll', onScroll);
    prevBtn.addEventListener('click', (e) => { e.preventDefault(); prevPage(); });
    nextBtn.addEventListener('click', (e) => { e.preventDefault(); nextPage(); });
    window.addEventListener('keydown', onKey);
    
    const allImgs = document.querySelectorAll('.carousel-img');
    allImgs.forEach(img => img.addEventListener('contextmenu', (e) => e.preventDefault()));
  }

  init();
</script>
</body>
